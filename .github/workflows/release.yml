name: Release

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ilivalidator-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build plugin ZIPs
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build plugin ZIPs
        shell: bash
        run: xvfb-run -a mvn -U -B -ntp clean verify

      - name: Verify ZIP contents and Commons snapshots
        run: python3 scripts/verify-packages.py

      - name: Test installed plugins in Hop 2.19
        run: python3 scripts/run-e2e.py

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          path: |
            **/target/surefire-reports/
            target/e2e/*.log
            target/e2e/*.csv
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ -z "$version" ]]; then
            echo "Could not resolve project.version from Maven" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate packaged ZIPs
        id: assets
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.meta.outputs.version }}"
          action_dir="assemblies/assemblies-action-ilivalidator/target"
          transform_dir="assemblies/assemblies-transform-ilivalidator/target"
          action_expected="hop-action-ilivalidator-${version}.zip"
          transform_expected="hop-transform-ilivalidator-${version}.zip"

          mapfile -t action_zip_files < <(find "$action_dir" -maxdepth 1 -type f -name '*.zip' | sort)
          mapfile -t transform_zip_files < <(find "$transform_dir" -maxdepth 1 -type f -name '*.zip' | sort)

          if [[ ${#action_zip_files[@]} -ne 1 ]]; then
            echo "Expected exactly 1 ZIP in $action_dir, found ${#action_zip_files[@]}" >&2
            printf '%s\n' "${action_zip_files[@]}"
            exit 1
          fi

          if [[ ${#transform_zip_files[@]} -ne 1 ]]; then
            echo "Expected exactly 1 ZIP in $transform_dir, found ${#transform_zip_files[@]}" >&2
            printf '%s\n' "${transform_zip_files[@]}"
            exit 1
          fi

          action_zip="${action_zip_files[0]}"
          transform_zip="${transform_zip_files[0]}"
          action_name="$(basename "$action_zip")"
          transform_name="$(basename "$transform_zip")"

          if [[ "$action_name" != "$action_expected" ]]; then
            echo "Unexpected action ZIP name: expected $action_expected, found $action_name" >&2
            exit 1
          fi

          if [[ "$transform_name" != "$transform_expected" ]]; then
            echo "Unexpected transform ZIP name: expected $transform_expected, found $transform_name" >&2
            exit 1
          fi

          echo "action_zip=$action_zip" >> "$GITHUB_OUTPUT"
          echo "transform_zip=$transform_zip" >> "$GITHUB_OUTPUT"

          ls -lh "$action_zip" "$transform_zip"

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-zips
          if-no-files-found: error
          path: |
            ${{ steps.assets.outputs.action_zip }}
            ${{ steps.assets.outputs.transform_zip }}
            target/package-verification.json
            target/e2e/results.json

  release:
    name: Create release
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download ZIP artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: dist

      - name: Collect ZIP assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t zip_files < <(find dist -type f -name '*.zip' | sort)

          if [[ ${#zip_files[@]} -ne 2 ]]; then
            echo "Expected exactly 2 ZIP files under dist/, found ${#zip_files[@]}" >&2
            find dist -maxdepth 4 -type f -print || true
            exit 1
          fi

          cp "${zip_files[@]}" release-assets/
          ls -la release-assets

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          safe_version="${version//+/-}"
          timestamp="$(date -u +%Y%m%d-%H%M)"
          short_sha="${GITHUB_SHA::7}"
          tag="auto-v${safe_version}-${timestamp}-${short_sha}"
          name="Auto Release ${version} (${timestamp} UTC)"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*.zip

      - name: Verify downloaded release ZIPs and rerun pipelines
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --dir downloaded --pattern '*.zip'
          for archive in release-assets/*.zip; do
            cmp "$archive" "downloaded/$(basename "$archive")"
          done
          python3 scripts/verify-packages.py --action downloaded/hop-action-ilivalidator-${{ needs.build.outputs.version }}.zip --transform downloaded/hop-transform-ilivalidator-${{ needs.build.outputs.version }}.zip
          python3 scripts/run-e2e.py --action downloaded/hop-action-ilivalidator-${{ needs.build.outputs.version }}.zip --transform downloaded/hop-transform-ilivalidator-${{ needs.build.outputs.version }}.zip
      - name: Upload release verification
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            target/package-verification.json
            target/e2e/results.json
