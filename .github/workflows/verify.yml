name: Verify INTERLIS Validator plugin

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    uses: edigonzales/hop-plugin-ci/.github/workflows/verify.yml@f0a1eec368cb8c5d2592086b26393a6fc3916ad1
    with:
      java-versions: '["21", "25"]'
      runner-os: '["ubuntu-latest", "macos-15", "windows-latest"]'
      canonical-runner-os: ubuntu-latest
      canonical-java-version: '21'
      maven-working-directory: .
      maven-options: -U -B -ntp
      maven-goals: clean verify
      compatibility-goals: clean test
      pom-file: pom.xml
      artifact-name-prefix: hop-ilivalidator-plugin
      artifacts: >-
        [{"file":"assemblies/assemblies-action-ilivalidator/target/hop-action-ilivalidator-*.zip"},
         {"file":"assemblies/assemblies-transform-ilivalidator/target/hop-transform-ilivalidator-*.zip"}]
      validation-command: |
        python3 scripts/verify-packages.py
        python3 scripts/run-e2e.py
    secrets: inherit
